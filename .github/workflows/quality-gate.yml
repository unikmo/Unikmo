name: Quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/stripe-checkout-admin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Offline identifier regression checks
        run: npm run qa:offline
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
